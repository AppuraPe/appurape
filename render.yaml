services:
  - type: web
    runtime: docker
    name: appurape-api
    rootDir: backend
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: AppuraPe.Api
      - key: Jwt__Audience
        value: AppuraPe.Client
      - key: Email__Provider
        value: Logging
      - key: Storage__Provider
        value: Supabase
      - key: Storage__Supabase__Url
        value: https://fbkachlnychsbptztbux.supabase.co
      - key: Storage__Supabase__ServiceKey
        sync: false
      - key: Storage__Supabase__Bucket
        value: appurape
      - key: Storage__PublicBaseUrl
        value: https://fbkachlnychsbptztbux.supabase.co/storage/v1/object/public/appurape
