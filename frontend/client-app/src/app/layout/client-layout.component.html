<header class="sticky top-0 z-30 border-b border-white/30 bg-white/10 backdrop-blur-xl">
  <nav class="mx-auto w-[min(1160px,calc(100%-1rem))] py-2" aria-label="Navbar principal de AppuraPe">
    <div class="rounded-[2rem] border border-loreto-crema/60 bg-white/45 px-4 py-3 shadow-loreto backdrop-blur-xl">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <a class="inline-flex items-center gap-3 text-primary-900 no-underline" routerLink="/restaurants" aria-label="Ir a restaurantes AppuraPe" (click)="closeNavbar()">
          <span class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-primary-700 via-primary-600 to-accent-500 text-lg font-black text-white shadow-lg shadow-primary-700/25">
            A
          </span>
          <span class="leading-tight">
            <strong class="block font-ui text-[1.65rem] font-bold">AppuraPe</strong>
            <small class="block font-ui text-xs font-semibold text-loreto-carbon/70">Delivery local</small>
          </span>
        </a>

        <button
          type="button"
          class="inline-flex h-11 w-11 items-center justify-center rounded-2xl border border-loreto-crema/70 bg-white/65 text-loreto-carbon transition hover:-translate-y-0.5 hover:bg-white/80 focus:outline-none focus:ring-2 focus:ring-primary-500/30 lg:hidden"
          aria-controls="appurape-navbar"
          [attr.aria-expanded]="isNavbarOpen()"
          aria-label="Abrir menu principal"
          (click)="toggleNavbar()"
        >
          <svg class="h-5 w-5" aria-hidden="true" fill="none" viewBox="0 0 17 14" xmlns="http://www.w3.org/2000/svg">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
          </svg>
        </button>

        <div
          id="appurape-navbar"
          class="w-full items-center justify-between lg:flex lg:w-auto"
          [class.hidden]="!isNavbarOpen()"
        >
          <div class="mt-4 grid gap-4 rounded-[1.75rem] border border-loreto-crema/70 bg-white/75 p-4 backdrop-blur-sm lg:mt-0 lg:flex lg:items-center lg:gap-3 lg:border-0 lg:bg-transparent lg:p-0 lg:backdrop-blur-0">
            <div class="flex flex-col gap-2 lg:flex-row lg:items-center">
              <a
                routerLink="/restaurants"
                routerLinkActive="bg-loreto-crema text-primary-700 shadow-sm"
                [routerLinkActiveOptions]="{ exact: false }"
                class="inline-flex min-h-11 items-center justify-center rounded-full px-5 py-2 text-center font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-white/80 hover:text-primary-700"
                (click)="closeNavbar()"
              >
                Restaurantes
              </a>
            </div>

            <div class="h-px bg-loreto-crema/70 lg:hidden"></div>

            <div class="flex flex-col gap-2 lg:flex-row lg:items-center lg:gap-2">
              @if (isAuthenticated()) {
                <div class="relative">
                  <button
                    type="button"
                    class="inline-flex min-h-11 w-full items-center justify-between gap-3 rounded-full border border-loreto-crema/70 bg-white/70 px-4 py-2 text-left font-ui text-sm font-semibold text-loreto-carbon transition hover:-translate-y-0.5 hover:bg-white/90 focus:outline-none focus:ring-2 focus:ring-primary-500/30 lg:min-w-[240px]"
                    aria-haspopup="menu"
                    [attr.aria-expanded]="isUserDropdownOpen()"
                    aria-controls="client-user-dropdown"
                    (click)="toggleUserDropdown()"
                  >
                    <span class="inline-flex min-w-0 items-center gap-3">
                      <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-gradient-to-br from-primary-700 via-primary-600 to-accent-500 text-xs font-bold text-white shadow-md shadow-primary-700/20">
                        {{ displayName().slice(0, 1) }}
                      </span>
                      <span class="truncate">{{ displayName() }}</span>
                    </span>
                    <svg class="h-4 w-4 flex-none transition" [class.rotate-180]="isUserDropdownOpen()" aria-hidden="true" fill="none" viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="m1 1 4 4 4-4" />
                    </svg>
                  </button>

                  @if (isUserDropdownOpen()) {
                    <div
                      id="client-user-dropdown"
                      role="menu"
                      class="mt-2 grid gap-1 rounded-[1.5rem] border border-loreto-crema/70 bg-surface-card/95 p-2 shadow-loreto backdrop-blur-xl lg:absolute lg:right-0 lg:mt-3 lg:min-w-[250px]"
                    >
                      <a
                        routerLink="/orders"
                        role="menuitem"
                        class="inline-flex min-h-11 items-center rounded-full px-4 py-2 font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-surface-soft hover:text-primary-700"
                        (click)="closeUserDropdown(); closeNavbar()"
                      >
                        Mis pedidos
                      </a>
                      <button
                        type="button"
                        role="menuitem"
                        class="inline-flex min-h-11 items-center rounded-full bg-gradient-to-r from-primary-700 via-primary-600 to-accent-500 px-4 py-2 text-left font-ui text-sm font-semibold text-white shadow-lg shadow-primary-700/15 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-primary-700/20"
                        (click)="logout()"
                      >
                        Cerrar sesion
                      </button>
                    </div>
                  }
                </div>
              } @else {
                <a
                  routerLink="/login"
                  routerLinkActive="border-primary-500/40 bg-white/90 text-primary-700"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="inline-flex min-h-11 items-center justify-center rounded-full border border-loreto-crema/70 bg-white/65 px-5 py-2 text-center font-ui text-sm font-semibold text-loreto-carbon transition hover:-translate-y-0.5 hover:bg-white/90 hover:text-primary-700"
                  (click)="closeNavbar()"
                >
                  Iniciar sesion
                </a>
                <a
                  routerLink="/register"
                  routerLinkActive="from-accent-500 via-primary-600 to-primary-700 text-white"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="inline-flex min-h-11 items-center justify-center rounded-full bg-gradient-to-r from-loreto-crema via-accent-500/90 to-primary-600 px-5 py-2 text-center font-ui text-sm font-semibold text-primary-900 shadow-lg shadow-accent-500/15 transition hover:-translate-y-0.5 hover:shadow-xl hover:shadow-accent-500/20 focus:outline-none focus:ring-2 focus:ring-accent-500/30"
                  (click)="closeNavbar()"
                >
                  Crear cuenta
                </a>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<ng-container *ngIf="checkoutDrawerUi.drawerTemplate() as drawerTemplate">
  <ng-container *ngTemplateOutlet="drawerTemplate; context: checkoutDrawerUi.drawerContext()"></ng-container>
</ng-container>
