<header class="sticky top-0 z-40 bg-transparent px-2 pt-2 sm:px-4 sm:pt-3">
  <nav class="mx-auto w-full max-w-[1240px]" aria-label="Navbar principal de AppuraPe">
    <div class="relative rounded-[18px] border border-[#ead8d2] bg-white/96 px-3 py-2 shadow-[0_6px_16px_rgba(6,25,43,0.05)] backdrop-blur-md sm:rounded-[20px] sm:px-4 sm:py-2.5 sm:shadow-[0_8px_20px_rgba(6,25,43,0.07)]">
      <div class="flex items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-2">
          @if (shouldShowMobileBack()) {
            <button
              type="button"
              class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[16px] border border-[#ead8d2] bg-surface-soft text-loreto-carbon transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/20 lg:hidden"
              aria-label="Volver a la pantalla anterior"
              (click)="goBack()"
            >
              <svg class="h-4 w-4" aria-hidden="true" fill="none" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M11.5 3.5 6 9l5.5 5.5" />
              </svg>
            </button>
          }

          <a class="inline-flex min-w-0 items-center gap-2.5 text-primary-900 no-underline" routerLink="/restaurants" aria-label="Ir a restaurantes AppuraPe" (click)="closeNavbar()">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-[16px] bg-primary-700 text-sm font-black text-white shadow-[0_6px_14px_rgba(229,27,35,0.18)]">
              A
            </span>
            <span class="min-w-0 leading-tight">
              <strong class="block truncate font-ui text-[1.05rem] font-bold tracking-[-0.03em]">AppuraPe</strong>
            </span>
          </a>
        </div>

        <button
          type="button"
          class="inline-flex h-9 w-9 items-center justify-center rounded-[16px] border border-[#ead8d2] bg-surface-soft text-loreto-carbon transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/20 lg:hidden"
          aria-controls="appurape-navbar"
          [attr.aria-expanded]="isNavbarOpen()"
          aria-label="Abrir menú principal"
          (click)="toggleNavbar()"
        >
          <svg class="h-5 w-5" aria-hidden="true" fill="none" viewBox="0 0 17 14" xmlns="http://www.w3.org/2000/svg">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15" />
          </svg>
        </button>

        <div
          id="appurape-navbar"
          class="absolute inset-x-0 top-full mt-2 items-center justify-between lg:static lg:mt-0 lg:flex lg:w-auto"
          [class.hidden]="!isNavbarOpen()"
        >
          <div class="grid gap-3 rounded-[18px] border border-[#f0dfda] bg-white p-3 shadow-[0_12px_28px_rgba(6,25,43,0.08)] lg:mt-0 lg:flex lg:items-center lg:gap-2 lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none">
            <div class="flex flex-col gap-1.5 lg:flex-row lg:items-center">
              <a
                routerLink="/restaurants"
                routerLinkActive="bg-primary-100 text-primary-700"
                [routerLinkActiveOptions]="{ exact: false }"
                class="inline-flex min-h-10 items-center justify-center rounded-full px-4 py-2 text-center font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-surface-soft hover:text-primary-700"
                (click)="closeNavbar()"
              >
                Restaurantes
              </a>
              @if (isAuthenticated()) {
                <a
                  routerLink="/community"
                  routerLinkActive="bg-primary-100 text-primary-700"
                  [routerLinkActiveOptions]="{ exact: false }"
                  class="inline-flex min-h-10 items-center justify-center rounded-full px-4 py-2 text-center font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-surface-soft hover:text-primary-700"
                  (click)="closeNavbar()"
                >
                  Comunidad
                </a>
              }
            </div>

            <div class="h-px bg-primary-100/80 lg:hidden"></div>

            <div class="flex flex-col gap-2 lg:flex-row lg:items-center lg:gap-2">
              @if (isAuthenticated()) {
                <div class="relative">
                  <button
                    type="button"
                    class="inline-flex min-h-11 w-full items-center justify-between gap-3 rounded-full border border-[#ead8d2] bg-surface-soft px-4 py-2 text-left font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/20 lg:min-w-[220px]"
                    aria-haspopup="menu"
                    [attr.aria-expanded]="isUserDropdownOpen()"
                    aria-controls="client-user-dropdown"
                    (click)="toggleUserDropdown()"
                  >
                    <span class="inline-flex min-w-0 items-center gap-3">
                      <span class="grid h-8 w-8 flex-none place-items-center rounded-full bg-primary-700 text-xs font-bold text-white">
                        {{ displayName().slice(0, 1) }}
                      </span>
                      <span class="truncate">{{ displayName() }}</span>
                    </span>
                    <svg class="h-4 w-4 flex-none transition" [class.rotate-180]="isUserDropdownOpen()" aria-hidden="true" fill="none" viewBox="0 0 10 6" xmlns="http://www.w3.org/2000/svg">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="m1 1 4 4 4-4" />
                    </svg>
                  </button>

                  @if (isUserDropdownOpen()) {
                    <div
                      id="client-user-dropdown"
                      role="menu"
                      class="mt-2 grid gap-1 rounded-[18px] border border-[#ead8d2] bg-white p-2 shadow-[0_12px_28px_rgba(6,25,43,0.1)] lg:absolute lg:right-0 lg:mt-3 lg:min-w-[230px]"
                    >
                      <a
                        [routerLink]="primaryDestinationRoute()"
                        role="menuitem"
                        class="inline-flex min-h-11 items-center rounded-full px-4 py-2 font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-surface-soft hover:text-primary-700"
                        (click)="closeUserDropdown(); closeNavbar()"
                      >
                        {{ primaryDestinationLabel() }}
                      </a>
                      <a
                        routerLink="/community"
                        role="menuitem"
                        class="inline-flex min-h-11 items-center rounded-full px-4 py-2 font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-surface-soft hover:text-primary-700"
                        (click)="closeUserDropdown(); closeNavbar()"
                      >
                        Comunidad
                      </a>
                      <button
                        type="button"
                        role="menuitem"
                        class="inline-flex min-h-11 items-center rounded-full bg-primary-700 px-4 py-2 text-left font-ui text-sm font-semibold text-white transition hover:bg-primary-600"
                        (click)="logout()"
                      >
                        Salir
                      </button>
                    </div>
                  }
                </div>
              } @else {
                <a
                  routerLink="/login"
                  routerLinkActive="border-primary-500/40 bg-white text-primary-700"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="inline-flex min-h-10 items-center justify-center rounded-full border border-[#ead8d2] bg-surface-soft px-4 py-2 text-center font-ui text-sm font-semibold text-loreto-carbon transition hover:bg-white hover:text-primary-700"
                  (click)="closeNavbar()"
                >
                  Login
                </a>
                <a
                  routerLink="/register"
                  routerLinkActive="bg-primary-700 text-white"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="inline-flex min-h-10 items-center justify-center rounded-full bg-primary-700 px-4 py-2 text-center font-ui text-sm font-semibold text-white shadow-[0_8px_16px_rgba(229,27,35,0.16)] transition hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-accent-500/20"
                  (click)="closeNavbar()"
                >
                  Registro
                </a>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>

<main class="min-w-0 overflow-x-hidden">
  <router-outlet />
</main>

<ng-container *ngIf="checkoutDrawerUi.drawerTemplate() as drawerTemplate">
  <ng-container *ngTemplateOutlet="drawerTemplate; context: checkoutDrawerUi.drawerContext()"></ng-container>
</ng-container>
